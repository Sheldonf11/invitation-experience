<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Invitation AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #soundButton {
      position: fixed;
      right: 20px;
      bottom: 30px;

      z-index: 99999;

      width: 54px;
      height: 54px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      font-size: 25px;

      display: none;

      align-items: center;
      justify-content: center;

      box-shadow: 0 3px 15px rgba(0,0,0,0.35);
    }

    #soundButton:active {
      transform: scale(0.94);
    }
  </style>
</head>

<body>

  <!-- Sound control -->
  <button id="soundButton" type="button">
    🔇
  </button>


  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>

      <video
        id="testVideo"
        src="./test.mp4"
        preload="auto"
        muted
        loop
        playsinline
        webkit-playsinline
      ></video>

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0"
    >

      <a-video
        id="arVideo"
        src="#testVideo"

        width="0.9"
        height="0.50625"

        position="0 0 0.02"

        material="shader: flat"
      ></a-video>

    </a-entity>

  </a-scene>


  <script>

    const target =
      document.querySelector(
        '[mindar-image-target="targetIndex: 0"]'
      );

    const video =
      document.getElementById("testVideo");

    const soundButton =
      document.getElementById("soundButton");


    let soundOn = false;


    /*
     * IMAGE FOUND
     */

    target.addEventListener("targetFound", () => {

      video.muted = true;

      video.play().catch(error => {
        console.log(
          "Video playback blocked:",
          error
        );
      });

      soundButton.style.display = "flex";

    });


    /*
     * IMAGE LOST
     */

    target.addEventListener("targetLost", () => {

      video.pause();

      soundButton.style.display = "none";

      soundOn = false;

      video.muted = true;

      soundButton.textContent = "🔇";

    });


    /*
     * SOUND BUTTON
     */

    soundButton.addEventListener("click", async (event) => {

      event.stopPropagation();

      if (!soundOn) {

        video.muted = false;

        try {

          await video.play();

          soundOn = true;

          soundButton.textContent = "🔊";

        } catch (error) {

          console.log(
            "Could not enable sound:",
            error
          );

          video.muted = true;

        }

      } else {

        video.muted = true;

        soundOn = false;

        soundButton.textContent = "🔇";

      }

    });

  </script>

</body>
</html>
