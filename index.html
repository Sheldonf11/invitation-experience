<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>Invitation AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiLoading: yes;
    uiScanning: yes;
    uiError: yes;
  "
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <!-- =====================================================
       VIDEO
       ===================================================== -->

  <a-assets>

    <video
      id="testVideo"
      src="./test.mp4"
      preload="auto"
      muted
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
    ></video>

  </a-assets>


  <!-- =====================================================
       CAMERA
       ===================================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  ></a-camera>


  <!-- =====================================================
       AR TARGET
       ===================================================== -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0"
  >

    <!--
      Square AR frame.

      The target image itself is square, so this occupies
      the same 1 × 1 coordinate space as the target.
    -->

    <a-plane
      id="videoPlane"

      width="1"
      height="1"

      position="0 0 0.02"

      material="
        shader: flat;
        src: #testVideo;
        transparent: true;
        opacity: 0;
        side: double;
      "
    ></a-plane>

  </a-entity>

</a-scene>


<script>

  const target =
    document.getElementById("target");

  const video =
    document.getElementById("testVideo");

  const videoPlane =
    document.getElementById("videoPlane");


  /*
   * We use the video's texture but crop its vertical
   * letterboxing using the texture repeat/offset.
   *
   * Your test video has a wide cinematic image with
   * black space above and below.
   */

  const plane =
    videoPlane.getObject3D("mesh");


  function prepareVideoTexture() {

    const mesh =
      videoPlane.getObject3D("mesh");

    if (!mesh || !mesh.material) {
      requestAnimationFrame(prepareVideoTexture);
      return;
    }

    const material =
      mesh.material;

    const texture =
      material.map;

    if (!texture) {
      requestAnimationFrame(prepareVideoTexture);
      return;
    }

    /*
     * Crop the top and bottom portions of the video.
     *
     * 0.28 → 0.72 means we keep the middle 44%.
     *
     * This is intentionally aggressive for the test video
     * shown in your screenshot.
     */

    texture.repeat.set(1, 0.44);

    texture.offset.set(0, 0.28);

    texture.needsUpdate = true;
  }


  prepareVideoTexture();


  /*
   * IMAGE FOUND
   */

  target.addEventListener("targetFound", async () => {

    video.muted = true;

    try {

      await video.play();

      /*
       * Fade the AR video in.
       */

      videoPlane.setAttribute(
        "animation__fadein",
        {
          property: "material.opacity",
          from: 0,
          to: 1,
          dur: 350,
          easing: "easeOutQuad"
        }
      );

    } catch (error) {

      console.log(
        "Video autoplay blocked:",
        error
      );

    }

  });


  /*
   * IMAGE LOST
   */

  target.addEventListener("targetLost", () => {

    video.pause();

    videoPlane.setAttribute(
      "material",
      "opacity: 0"
    );

  });


  /*
   * iPhone autoplay assistance.
   *
   * Any user interaction on the page gives the browser
   * permission to keep the muted video ready.
   */

  document.addEventListener(
    "touchstart",
    () => {

      video.muted = true;

      if (video.paused) {
        video.play().catch(() => {});
      }

    },
    {
      once: true,
      passive: true
    }
  );

</script>

</body>
</html>
